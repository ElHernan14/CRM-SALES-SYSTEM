version: "3.9"

services:
  nexora-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexora-api

    ports:
      - "8081:8081"

    env_file:
      - .env

    environment:
      UPLOAD_DIR: /app/uploads

    volumes:
      - ./uploads:/app/uploads

    restart: unless-stopped
